  #     POSTGRES_USER: etudesk
  #     POSTGRES_PASSWORD: etudesk
  #     POSTGRES_DB: etudesk
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

  # Neo4j Graph Database (optional - if not using Neo4j Aura)
  # Web UI: http://localhost:7474
  # Bolt: bolt://localhost:7687
  # neo4j:
  #   image: neo4j:5.15-community
