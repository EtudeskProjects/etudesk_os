  #   ports:
  #     - "7474:7474"  # HTTP/Browser
  #     - "7687:7687"  # Bolt protocol
  #   environment:
  #     - NEO4J_AUTH=neo4j/etudesk_graph_2024
  #     - NEO4J_PLUGINS=["apoc"]
