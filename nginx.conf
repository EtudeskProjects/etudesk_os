# Etudesk API — Nginx Reverse Proxy Configuration
# VPS: vps117933.serveur-vps.net (31.207.33.69)
# Deploy: Copy to /etc/nginx/sites-available/etudesk && ln -s /etc/nginx/sites-available/etudesk /etc/nginx/sites-enabled/
# Test: nginx -t && systemctl reload nginx

upstream etudesk_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name vps117933.serveur-vps.net 31.207.33.69;

    # Redirect HTTP → HTTPS (uncomment when SSL is configured)
    # return 301 https://$server_name$request_uri;

    # --- Gzip Compression (P0 #1) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        text/xml
        image/svg+xml
        text/event-stream;

    # --- HTTP Cache Headers (P0 #2) ---

    # Static files (uploads, images) — cache 7 days
    location /uploads/ {
        alias /var/www/etudesk/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Ecosystem/batch endpoints — cache 2 min at Nginx level
    location ~ ^/api/v1/(ecosystem|entities/batch) {
        proxy_pass http://etudesk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache_valid 200 2m;
        add_header Cache-Control "public, max-age=120";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Health check — lightweight, cache 30s
    location = /health {
        proxy_pass http://etudesk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache_valid 200 30s;
        add_header Cache-Control "public, max-age=30";
    }

    # SSE streaming (copilot chat) — special handling
    location = /api/v1/copilot/chat {
        proxy_pass http://etudesk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE: disable buffering for real-time streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Long timeout for agent workflows (up to 5 min)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Short link redirects — fast, no cache
    location /link/ {
        proxy_pass http://etudesk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }

    # All other API routes
    location /api/ {
        proxy_pass http://etudesk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # No cache for API mutations
        add_header Cache-Control "no-store";

        # Timeouts
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Security Headers ---
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # --- Request Size ---
    client_max_body_size 25m;

    # --- Logging ---
    access_log /var/log/nginx/etudesk_access.log;
    error_log /var/log/nginx/etudesk_error.log;
}
